parameters:
- name: repo
  type: string
  default: self

- name: arch
  type: string
  values:
  - amd64
  - armhf
  - arm64

- name: pool
  type: string
  values:
  - sonicso1ES-amd64
  - sonicso1ES-arm64
  - sonicso1ES-armhf
  - default
  default: default

- name: timeout
  type: number
  default: 60

- name: artifact_name
  type: string

- name: syslog_artifact_name
  type: string

- name: run_unit_test
  type: boolean
  default: false

- name: archive_gcov
  type: boolean
  default: false

- name: asan
  type: boolean
  default: false

- name: staged_upstreams
  # List of {artifact: <current-run AZP artifact>, name: <upstream YAML name>}.
  # Used when another pipeline reuses this template and must build sairedis
  # against an artifact produced earlier in that same run.
  type: object
  default: []

- name: debian_version
  type: string

jobs:
- job:
  displayName: ${{ parameters.arch }}
  timeoutInMinutes: ${{ parameters.timeout }}
  variables:
    DIFF_COVER_CHECK_THRESHOLD: 80
    ${{ if eq(parameters.run_unit_test, true) }}:
      DIFF_COVER_ENABLE: 'true'

  pool:
    ${{ if ne(parameters.pool, 'default') }}:
      name: ${{ parameters.pool }}
    ${{ else }}:
      vmImage: 'ubuntu-22.04'

  container:
    image: sonicdev-microsoft.azurecr.io:443/sonic-slave-${{ parameters.debian_version }}:$(BUILD_BRANCH)-${{ parameters.arch }}
    options:  "--privileged"

  steps:
  - checkout: ${{ parameters.repo }}
    clean: true
    submodules: true
    ${{ if ne(parameters.repo, 'self') }}:
      path: s

  # A consumer reusing this template can stage current-run upstream artifacts
  # under the names used by build-env/upstream-artifacts.yaml.
  - ${{ each up in parameters.staged_upstreams }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: ${{ up.artifact }}
        path: $(Pipeline.Workspace)/staged/${{ up.name }}
      displayName: "Stage current-run ${{ up.name }} for the cascade"

  - script: |
      set -ex
      sudo apt-get update
      sudo apt-get install -qq -y python3-yaml python3-requests git

      clone_swss_common() {
        ref="$1"
        for delay in 0 5 15; do
          [ "$delay" -eq 0 ] || sleep "$delay"
          rm -rf /tmp/sw-common
          git clone --depth 1 --branch "$ref" \
            https://github.com/sonic-net/sonic-swss-common /tmp/sw-common && return 0
        done
        return 1
      }

      # Keep the shared tool and upstream artifacts on the same branch. Release
      # and master builds fail closed; feature branches may fall back to master
      # when there is no matching sonic-swss-common branch.
      SETUP_BRANCH="$(BUILD_BRANCH)"
      if ! clone_swss_common "$SETUP_BRANCH"; then
        case "$(BUILD_BRANCH)" in
          master|20[0-9][0-9][0-9][0-9])
            echo "Failed to clone required sonic-swss-common branch $(BUILD_BRANCH)" >&2
            exit 1
            ;;
          *)
            echo "No matching swss-common feature branch; falling back to master"
            clone_swss_common master
            SETUP_BRANCH=master
            ;;
        esac
      fi

      REQ_ARGS=$(python3 -c "import json,os; print(' '.join('--required-staged-upstream '+u['name'] for u in json.loads(os.environ.get('STAGED_UPSTREAMS_JSON','[]'))))")
      PYTHONPATH=/tmp/sw-common/ci python3 -m buildenv_setup \
        --repo-dir $(Build.SourcesDirectory) \
        --scope build \
        --arch ${{ parameters.arch }} \
        --debian-version ${{ parameters.debian_version }} \
        --branch "$SETUP_BRANCH" \
        --upstream-staged-dir $(Pipeline.Workspace)/staged \
        $REQ_ARGS
    displayName: "Set up build environment (buildenv_setup)"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      STAGED_UPSTREAMS_JSON: ${{ convertToJson(parameters.staged_upstreams) }}

  - script: ASAN=${{ parameters.asan }} ./build-env/build.sh
    displayName: "Compile sonic sairedis with coverage enabled"
  - script: |
      set -ex
      sudo cp azsyslog.conf /etc/rsyslog.conf
      cat /run/rsyslogd.pid
      sudo pkill -F /run/rsyslogd.pid
      # Looks like arm64 (and sometimes amd64) rsyslogd needs some time to exit
      sleep 2
      ps -ef
      sudo rsyslogd
    displayName: "Update rsyslog.conf"
  - ${{ if eq(parameters.run_unit_test, true) }}:
    - script: |
        set -ex
        # Add SYS_TIME capability for settimeofday ok in syncd test
        sudo setcap "cap_sys_time=eip" syncd/.libs/syncd_tests
        # Add CAP_DAC_OVERRIDE capability for system directory creation in syncd unittest
        sudo setcap "cap_dac_override,cap_ipc_lock,cap_ipc_owner,cap_sys_time=eip" unittest/syncd/.libs/tests
        make check
        gcovr --version
        find SAI/meta -name "*.gc*" -print -delete
        find -name 'libswsscommon_la*.gcda' -print -delete
        gcov_dirs=$(find . -path "*.libs*gcda" | xargs dirname | sort -u |  cut -c"3-")
        for dir in ${gcov_dirs}; do
          source_dir=$(dirname $dir)
          output_file=$(echo "coverage-$source_dir.json"| tr '/' '-')
          gcovr --exclude-unreachable-branches --json-pretty -o $output_file --object-directory $source_dir $dir
        done
        gcovr -r ./ -e ".*/SAI/.*" -e ".+/json.hpp" -e "swss/.+" -e ".*/.libs/.*" -e ".*/debian/.*" -e "vslib/vpp/.*" --exclude-unreachable-branches --json-pretty -o coverage-all.json
        gcovr -a "coverage-*.json" -x --xml-pretty -o coverage.xml
      displayName: "Run sonic sairedis unit tests"
  - publish: $(System.DefaultWorkingDirectory)/
    artifact: ${{ parameters.artifact_name }}
    displayName: "Archive sonic sairedis debian packages"
  - ${{ if eq(parameters.archive_gcov, true) }}:
      - script: |
          set -ex
          # Install .NET CORE
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          sudo apt-add-repository https://packages.microsoft.com/debian/12/prod
          sudo apt-get update
          sudo apt-get install -y dotnet-sdk-8.0
        displayName: "Install .NET CORE"
      - task: PublishCodeCoverageResults@1
        inputs:
            codeCoverageTool: Cobertura
            summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
        displayName: 'Publish test coverage'
  - script: |
      pwd
      sudo chmod a+r /var/log/syslog*
      tar -czf syslog-all.tgz /var/log/syslog*
      ls -al .
      ls -al /var/log/
    displayName: "Env info"
    condition: always()
  - task: CopyFiles@2
    displayName: "Copy syslog to staging directory"
    condition: always()
    inputs:
        contents: 'syslog-all.tgz'
        targetFolder: $(Build.ArtifactStagingDirectory)
  - publish: $(Build.ArtifactStagingDirectory)/
    artifact: ${{ parameters.syslog_artifact_name }}@$(System.JobAttempt)
    displayName: "Publish syslog artifacts"
    condition: always()
